openapi: 3.2.0
info:
  title: TritonAI Developer API (LiteLLM Gateway) Models API
  description: OpenAI-compatible LLM gateway operated by UC San Diego, powered by LiteLLM.
  version: 1.0.0
  contact:
    name: TritonAI
    email: tritonai@ucsd.edu
    url: https://tritonai.ucsd.edu/developer-apis/index.html
servers:
- url: https://tritonai-api.ucsd.edu
  description: TritonAI LLM gateway
security:
- bearerAuth: []
tags:
- name: Models
  description: Model discovery endpoints.
paths:
  /v1/models:
    get:
      tags:
      - Models
      summary: Model List
      operationId: model_list
      description: List the models available through the gateway.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Issued TritonAI API key passed as a Bearer token.
