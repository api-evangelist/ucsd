- date: '2026-08-19'
  rating: 3
  summary: 'Re-profiled under the API Evangelist university pipeline, which settles operator attribution
    before saving anything. The June 2026 review understated UC San Diego in two places and overstated
    it in two others. Understated: the TritonAI gateway publishes a live OpenAPI 3.1 document at https://tritonai-api.ucsd.edu/openapi.json
    (LiteLLM 1.97.0, 525 paths / 711 operations) that includes an 18-operation SCIM 2.0 provisioning surface,
    and the Library Digital Collections does have a public machine-readable interface after all — undocumented
    Solr JSON at /dc/search.json and /dc/object/{id}.json. Also newly recorded: a WSO2 API Manager 4.1.0
    gateway at api.ucsd.edu (live, catalogue gated at 401 because IsAnonymousModeEnabled=false) and the
    InCommon SAML metadata for urn:mace:incommon:ucsd.edu, which is the only fully open machine-readable
    contract the institution publishes. Overstated: developer.ucsd.edu is the campus web DESIGN system
    ("Decorator 5"), not an API developer portal, and collab.ucsd.edu is a 302 stub in front of an Atlassian
    Confluence Cloud tenant, so the "Web API Portal" is re-labelled x-operator: tenant. No OAI-PMH and
    no IIIF surface exists on any ucsd.edu host; an earlier rate-limits artifact asserting one has been
    corrected. library.ucsd.edu serves an Anubis bot challenge at HTTP 200 to browser User-Agents on every
    path, which is the failure mode most likely to mis-grade this institution. Nothing was fabricated
    and no vendor contract was attributed to UC San Diego.'
  endpoints:
  - url: https://tritonai-api.ucsd.edu/openapi.json
    status: 200
