x-coverage:
  state: covered
  reason: partial_public_surface
  detail: >-
    Probed 2026-08-19 across every surface class a university actually operates. UC San Diego
    has more institution-operated infrastructure than most of this cohort, but almost none of
    it is open: the TritonAI gateway publishes its OpenAPI anonymously yet gates every call
    behind an issued key; the WSO2 gateway at api.ucsd.edu answers its settings endpoint
    anonymously and then returns 401 on the API catalogue because it runs with
    IsAnonymousModeEnabled=false; the Library Digital Collections JSON is fully open but
    undocumented, so it is described here from probes rather than from anything UC San Diego
    published. Course catalog (catalog.ucsd.edu, act.ucsd.edu) is HTML only with no data
    interface. No open data portal exists — data.ucsd.edu does not resolve. No OAI-PMH and no
    IIIF surface exists anywhere on a ucsd.edu host, contrary to what an earlier version of
    this profile assumed. The one collection-worthy artifact this pipeline can hold in full is
    the InCommon SAML metadata, which is public, machine-readable and complete.
  evidence:
    - url: https://tritonai-api.ucsd.edu/openapi.json
      status: 200
      note: Live OpenAPI 3.1, LiteLLM 1.97.0, 525 paths / 711 operations, no servers block.
    - url: https://api.ucsd.edu/api/am/devportal/v2/settings
      status: 200
      note: WSO2 API Manager 4.1.0; IsAnonymousModeEnabled=false.
    - url: https://api.ucsd.edu/api/am/devportal/v2/apis
      status: 401
      note: API catalogue is gated, not absent.
    - url: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aucsd.edu
      status: 200
      note: SAML 2.0 metadata, application/samlmetadata+xml, OrganizationName "University of California-San Diego".
    - url: https://library.ucsd.edu/dc/search.json?q=ocean
      status: 200
      note: Live Solr JSON, numFound 12939, anonymous, undocumented.
    - url: https://library.ucsd.edu/dc/object/bb38236995.json
      status: 200
      note: Object-level JSON, 25KB Solr document.
    - url: https://library.ucsd.edu/dc/oai?verb=Identify
      status: 404
      note: No OAI-PMH. Also 404 at /dc/oai/oai and /oai.
    - url: https://library.ucsd.edu/dc/
      status: 200
      note: >-
        Serves an Anubis proof-of-work bot challenge (7537 bytes, "Making sure you're not a
        bot!") to browser User-Agents at HTTP 200 on every path. Plain User-Agents are served
        the real content. Presence of a 200 is not evidence of content on this host.
    - url: https://collab.ucsd.edu/api/api-documentation
      status: 302
      note: Redirects to https://ucsdcollab.atlassian.net/wiki — Confluence Cloud tenant, not campus-engineered.
    - url: https://data.ucsd.edu/
      status: 0
      note: Does not resolve. No open data portal.
    - url: https://developer.ucsd.edu/
      status: 200
      note: >-
        Campus web DESIGN system ("Decorator 5", kitchen sink, accessibility) — not an API
        developer portal, despite the hostname.
