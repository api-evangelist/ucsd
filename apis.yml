- aid: ucsd:library-digital-collections-api
  name: UC San Diego Library Digital Collections JSON API
  description: >-
    Public, read-only JSON search-and-retrieval over the UC San Diego Library Digital
    Collections, the Library's locally developed Fedora-backed Digital Asset Management System
    fronted by Blacklight/Solr. Request `.json` on a search or object path and the Solr response
    is returned directly — /dc/search.json, /dc/object/{id}.json, /dc/collection/{id}.json — with
    a server-side filter that keeps restricted and embargoed material out of anonymous results.
    UC San Diego runs this itself on its own origin inside campus address space; it is
    registered on re3data as an institutional data provider (r3d100011577). UC San Diego
    publishes no OpenAPI for it, so the contract in this repo was written from live probes and
    is marked accordingly.
  x-operator: institution
  humanURL: https://library.ucsd.edu/dc/
  baseURL: https://library.ucsd.edu
