- aid: ucsd:datacite-doi-registration
  name: UC San Diego DOI registration (DataCite / California Digital Library)
  description: >-
    UC San Diego Library mints DOIs for its Digital Collections under DataCite repository
    account CDL.UCSD ("UC San Diego", registered 2012), prefix 10.6075. 22,934 DOIs resolve to
    library.ucsd.edu/dc landing pages. TENANT: the DOIs, the metadata and the landing pages are
    UC San Diego's, but the registration API is DataCite's and the membership is held through
    the California Digital Library, so the contract is not the institution's and is not saved
    here. Recorded because it is a real institutional fact and satisfies the education regime's
    `datacite` domain standard.
  x-operator: tenant
