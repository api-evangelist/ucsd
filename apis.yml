  name: TritonAI Developer API — SCIM 2.0 provisioning
  description: >-
    SCIM 2.0 (RFC 7643 / RFC 7644) user and group provisioning surface exposed by the TritonAI
    gateway on UC San Diego infrastructure — 18 operations across /scim/v2/Users,
    /scim/v2/Groups, /scim/v2/Schemas, /scim/v2/ResourceTypes and
    /scim/v2/ServiceProviderConfig. The deployment is the institution's; the endpoint shapes
    are supplied by the LiteLLM proxy software it runs. Credential-gated and not documented on
    the campus-facing TritonAI developer pages. This is the education regime's `scim` domain
    standard, present in the contract rather than in a prose claim.
