    vendor platform, which is exactly the shape this pipeline exists to separate from real
    institutional engineering. The documentation itself is behind Single Sign-On: an anonymous
    fetch returns a 592KB Confluence SPA shell carrying no documentation text. The APIs it
    describes are available to UC San Diego staff, students and faculty only and are not open to
    developers outside the campus.
