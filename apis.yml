---
aid: ucsd
name: University of California, San Diego
description: >-
  University of California, San Diego is a public research university in La Jolla, California,
  and a campus of the University of California system. Its programmable footprint is real but
  almost entirely inward-facing, and the honest summary is that UC San Diego operates
  infrastructure rather than publishing products. Four surfaces are genuinely
  institution-operated: TritonAI, an OpenAI-compatible LLM gateway running on the campus
  Data Science and Machine Learning Platform at tritonai-api.ucsd.edu, which publishes a live
  OpenAPI document and a SCIM 2.0 provisioning surface; a WSO2 API Manager 4.1.0 gateway at
  api.ucsd.edu whose catalogue is closed to anonymous clients; a Shibboleth identity provider
  registered in InCommon as urn:mace:incommon:ucsd.edu, whose SAML metadata is the one fully
  public machine-readable contract the institution has; and the Library Digital Collections,
  a locally developed Fedora/Solr repository that answers undocumented but live JSON at
  library.ucsd.edu/dc. What is NOT UC San Diego's own engineering is the campus API portal —
  collab.ucsd.edu redirects to an Atlassian Confluence Cloud tenant — and the DOI registration
  behind the repository, which runs on a California Digital Library DataCite account. There is
  no open, self-service, externally documented API; every campus API requires a UC San Diego
  Single Sign-On account or an issued credential, and the institution says so plainly.
