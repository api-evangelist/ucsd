- aid: ucsd:library-digital-collections
  name: UC San Diego Library Digital Collections
  description: >-
    The UC San Diego Library Digital Collections is a public search and discovery interface for over 100,000
    digital objects (documents, photographs, audio, video, and datasets) managed in the locally developed
    Digital Asset Management System (DAMS). It is registered as a research data repository on re3data.
    No formally documented public REST/IIIF/OAI-PMH API surface was confirmed during this review.
  humanURL: https://library.ucsd.edu/dc/
