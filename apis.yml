  name: UC San Diego Shibboleth Identity Provider (InCommon / eduGAIN)
  description: >-
    UC San Diego's SAML 2.0 identity provider, "TritON", registered in the InCommon Federation
    under entityID urn:mace:incommon:ucsd.edu and distributed through the InCommon MDQ metadata
