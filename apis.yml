  name: UC San Diego Web API Portal (Atlassian Confluence Cloud tenant)
  description: >-
    The campus Web API Portal and REST API guidelines. TENANT, not institution-engineered —
    https://collab.ucsd.edu/api/api-documentation issues a 302 to
    https://ucsdcollab.atlassian.net/wiki and the content is served by AtlassianEdge from UC San
